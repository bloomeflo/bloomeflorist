<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bloomé Florist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&display=swap">
<style>
/* Layout concept: a gift-tag boutique. Arch-framed hero bouquet, scalloped bands between sections,
   and every bouquet carries a handwritten "story tag" (the brand idea made visible).
   Single bright look by choice: Bloomé is cheerful, so there is no dark theme. */
:root{
  color-scheme:light;
  --cream:#fff6ea; --paper:#fffdf9; --blush:#fbd3dc; --blush-wash:#fdebef;
  --sage:#9db78b; --sage-wash:#e4edd9; --sage-deep:#3f5a3a;
  --butter:#fbe38e; --butter-wash:#fff4c9;
  --hot:#d92b66; --hot-deep:#b81f52;
  --ink:#3a2530; --muted:#6f5a66; --line:#ecd9d4;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  --shadow:0 14px 30px -16px rgba(140,50,80,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,8vw,5rem);font-weight:750;letter-spacing:-.025em}
h2{font-size:clamp(1.9rem,4.6vw,3rem)}
h3{font-size:1.3rem}
p{margin:0}
a{color:inherit}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{position:relative;padding-block:clamp(48px,8vw,96px)}
.band.scal::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:14px;background:radial-gradient(circle at 50% 100%,var(--band) 0 13.5px,transparent 14.5px) 0 0/28px 14px repeat-x}
.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px 32px;flex-wrap:wrap;margin-bottom:clamp(24px,4vw,44px)}
.sec-head p{color:var(--muted);max-width:30em;margin-top:10px}
.hand{font-family:var(--hand);font-weight:600;font-size:1.35rem;color:var(--hot);line-height:1}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.logo svg{width:34px;height:34px;flex:none}
.nav{display:flex;gap:6px;align-items:center}
.nav a{text-decoration:none;font-weight:600;padding:9px 15px;border-radius:999px;transition:background .2s}
.nav a:hover{background:var(--blush-wash)}
.nav a.on{background:var(--blush)}
.menu-btn{display:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:22px;height:22px}
@media(max-width:820px){
  .menu-btn{display:inline-flex}
  .nav{position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:4px;background:var(--paper);padding:12px max(16px,env(safe-area-inset-left,0px)) 20px;border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:none}
  .nav.open{display:flex}
  .nav a{padding:14px 18px;font-size:1.1rem}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;border:2px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--hot);color:#fff;box-shadow:0 8px 18px -8px var(--hot)}
.btn-primary:hover{background:var(--hot-deep)}
.btn-soft{background:var(--blush);color:var(--ink)}
.btn-soft:hover{background:#f8bfcc}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.btn-wa{background:#1f7a4d;color:#fff}
.btn-wa:hover{background:#17623d}
.btn-sm{min-height:42px;padding:0 18px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* hero */
.hero{background:var(--cream);padding-block:clamp(28px,5vw,64px) clamp(56px,8vw,96px);overflow:hidden}
.hero .wrap{display:grid;gap:40px;align-items:center}
@media(min-width:900px){.hero .wrap{grid-template-columns:1.05fr .95fr}}
.hero h1{margin-block:14px 20px}
.hero .lead{margin-bottom:28px}
.arch{position:relative;max-width:460px;margin-inline:auto;width:100%}
.arch-frame{aspect-ratio:4/5;border-radius:999px 999px 28px 28px;background:linear-gradient(180deg,var(--blush) 0%,var(--blush) 55%,var(--sage-wash) 55%);display:flex;align-items:flex-end;justify-content:center;padding:16% 6% 4%;overflow:hidden;border:3px solid var(--ink)}
.arch-frame svg{width:100%;height:auto}
.sticker{position:absolute;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.sticker.round{width:112px;height:112px;border-radius:50%;background:var(--butter);right:-6px;top:6%;transform:rotate(10deg);font-size:.92rem;padding:12px}
.sticker.pill{left:-6px;bottom:14%;padding:10px 16px;border-radius:999px;background:var(--paper);transform:rotate(-6deg);font-family:var(--hand);font-size:1.35rem;font-weight:600;color:var(--hot)}
@media(prefers-reduced-motion:no-preference){.sticker.round{animation:bob 5s ease-in-out infinite}}
@keyframes bob{50%{transform:rotate(4deg) translateY(-6px)}}
.doodle{position:absolute;pointer-events:none}

/* categories */
.cats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.cats{grid-template-columns:repeat(5,1fr)}}
.cat{display:flex;flex-direction:column;text-decoration:none;border-radius:26px;overflow:hidden;border:2px solid var(--ink);background:var(--paper);transition:transform .2s,box-shadow .2s;min-width:0}
.cat:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:5px 6px 0 var(--ink)}
.cat .pic{aspect-ratio:1/1;display:grid;place-items:end center;overflow:hidden}
.cat .pic svg{width:100%;height:100%}
.cat b{padding:12px 14px 14px;font-family:var(--serif);font-size:1.05rem;line-height:1.2;border-top:2px solid var(--ink);display:block}
.cat small{display:block;font-family:var(--sans);font-weight:500;color:var(--muted);font-size:.85rem;margin-top:2px}

/* product cards */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{display:flex;flex-direction:column;background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card .art{position:relative;aspect-ratio:1/1.02;display:flex;align-items:flex-end;justify-content:center;padding:14px 14px 0;text-decoration:none;overflow:hidden}
.card .art svg{width:100%;height:100%}
.tag{position:absolute;left:12px;top:14px;max-width:70%;background:var(--butter);padding:7px 12px 7px 26px;font-family:var(--hand);font-size:1.12rem;font-weight:600;line-height:1.05;color:var(--ink);transform:rotate(-3deg);clip-path:polygon(0 50%,13px 0,100% 0,100% 100%,13px 100%)}
.tag::before{content:"";position:absolute;left:13px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--paper)}
.card .body{display:flex;flex-direction:column;gap:6px;padding:16px 18px 20px;flex:1}
.card h3{font-size:1.3rem}
.card .occ{font-size:.85rem;font-weight:600;color:var(--hot-deep)}
.card .desc{color:var(--muted);font-size:.97rem;flex:1}
.price{font-family:var(--serif);font-weight:750;font-size:1.3rem;font-variant-numeric:tabular-nums}
.price small{font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--muted);margin-right:3px}
.card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .actions .btn{flex:1;white-space:nowrap}

/* why */
.why{--band:var(--blush);background:var(--blush)}
.whys{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.why-i{background:var(--paper);border-radius:26px;padding:24px;border:2px solid var(--ink)}
.why-i:nth-child(even){transform:rotate(.7deg)}.why-i:nth-child(odd){transform:rotate(-.7deg)}
.why-i svg{width:54px;height:54px;margin-bottom:14px}
.why-i p{color:var(--muted);margin-top:8px}

/* testimonials */
.reviews{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.rev{background:var(--paper);border-radius:6px 28px 28px 28px;padding:26px 24px;box-shadow:var(--shadow)}
.rev:nth-child(2){background:var(--butter-wash)}
.rev q{display:block;font-family:var(--serif);font-size:1.18rem;line-height:1.4;quotes:"“" "”"}
.rev footer{margin-top:16px;font-size:.92rem;color:var(--muted);font-weight:500}
.stars{color:var(--hot);letter-spacing:3px;margin-bottom:10px;font-size:1.05rem}
.note{font-size:.88rem;color:var(--muted);margin-top:22px}

/* instagram */
.ig-grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.ig-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.ig-grid{grid-template-columns:repeat(6,1fr)}}
.ig{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;display:block;text-decoration:none}
.ig svg{width:100%;height:100%;display:block;transition:transform .35s}
.ig:hover svg{transform:scale(1.06)}
.ig span{position:absolute;inset:auto 0 0;padding:26px 10px 10px;text-align:center;font-weight:700;font-size:.88rem;color:#fff;background:linear-gradient(transparent,rgba(58,37,48,.7));opacity:0;transition:opacity .2s}
.ig:hover span,.ig:focus-visible span{opacity:1}

/* CTA */
.cta{--band:var(--hot);background:var(--hot);color:#fff}
.cta .wrap{display:grid;gap:28px;align-items:center}
@media(min-width:820px){.cta .wrap{grid-template-columns:1.2fr .8fr}}
.cta p{color:#ffe9ef;max-width:32em;margin-block:14px 24px;font-size:1.1rem}
.cta .btn-primary{background:var(--butter);color:var(--ink);box-shadow:none}
.cta .btn-primary:hover{background:#f6d669}
.cta .art-wrap{background:var(--blush);border-radius:999px 999px 24px 24px;padding:8% 10% 0;max-width:300px;width:100%;margin-inline:auto;border:3px solid var(--ink)}

/* footer */
.foot{background:var(--sage-deep);color:var(--cream);padding-block:56px 36px}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline}
.foot .cols{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.foot h4{font-size:1.05rem;margin-bottom:12px;color:var(--butter)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:#e7efdf}
.foot .logo{color:var(--cream);margin-bottom:12px}
.foot .small{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,246,234,.25);font-size:.88rem;color:#d5e2cb}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}

/* page header (inner pages) */
.page-head{background:var(--blush-wash);padding-block:clamp(36px,6vw,72px) clamp(28px,5vw,48px)}
.page-head p{margin-top:14px}

/* shop */
.toolbar{display:grid;gap:14px;margin-bottom:22px}
.search{position:relative}
.search input{width:100%;min-height:52px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);padding:0 20px 0 50px}
.search svg{position:absolute;left:18px;top:50%;width:20px;height:20px;transform:translateY(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:600;cursor:pointer}
.chip:hover{background:var(--blush-wash)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.sel-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sel-row .selects{display:flex;gap:10px;flex-wrap:wrap}
select,input[type=text],input[type=tel],input[type=date],input[type=number],textarea{width:100%;min-height:48px;border-radius:16px;border:2px solid var(--line);background:var(--paper);padding:10px 14px;transition:border-color .2s}
select:hover,input:hover,textarea:hover{border-color:#e2bfc0}
select:focus,input:focus,textarea:focus{border-color:var(--hot);outline:none;box-shadow:0 0 0 3px rgba(217,43,102,.2)}
.sel-row select{width:auto;min-width:160px;border-radius:999px;border-color:var(--ink);padding-inline:18px}
textarea{min-height:96px;resize:vertical}
.banner{background:var(--butter-wash);border:2px dashed #e0b83c;border-radius:16px;padding:12px 16px;font-size:.92rem;margin-bottom:22px}
.empty{text-align:center;padding:48px 16px;background:var(--paper);border-radius:28px;border:2px dashed var(--line)}
.empty p{color:var(--muted);margin:8px 0 18px}

/* product detail */
.crumbs{padding-block:18px 0;font-size:.92rem;color:var(--muted)}
.crumbs a{font-weight:600;color:var(--ink)}
.pd{display:grid;gap:32px;padding-block:20px 56px}
@media(min-width:900px){.pd{grid-template-columns:1fr 1fr;gap:56px}}
.pd-art{position:sticky;top:90px;align-self:start}
@media(max-width:899px){.pd-art{position:static}}
.pd-main{border-radius:32px;border:2px solid var(--ink);overflow:hidden;aspect-ratio:1/1.05;position:relative;display:flex;justify-content:center;align-items:flex-end;padding:18px 18px 0}
.pd-main svg{width:100%;height:100%}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumb{width:76px;height:76px;border-radius:16px;border:2px solid var(--line);padding:0;overflow:hidden;cursor:pointer;background:var(--paper)}
.thumb[aria-pressed="true"]{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.thumb svg{width:100%;height:100%;display:block}
.pd-info{display:grid;gap:22px;align-content:start;min-width:0}
.pd-info h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.pd-price{font-family:var(--serif);font-size:2rem;font-weight:750;font-variant-numeric:tabular-nums}
.pd-price small{display:block;font-family:var(--sans);font-size:.85rem;font-weight:500;color:var(--muted)}
.opt-title{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.opt-title span{font-weight:500;color:var(--muted);font-size:.9rem}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.choice{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;padding:13px 15px;border-radius:18px;border:2px solid var(--line);background:var(--paper);cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.choice:hover{border-color:#e2bfc0}
.choice[aria-checked="true"],.choice[aria-pressed="true"]{border-color:var(--hot);background:var(--blush-wash);box-shadow:0 0 0 1px var(--hot)}
.choice b{font-size:1rem}.choice small{color:var(--muted);font-size:.85rem}
.flower-list{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.flower-list li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;background:var(--paper);border-radius:999px;border:1px solid var(--line);font-size:.95rem}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(58,37,48,.3);flex:none}
.addon{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.addon:has(input:checked){border-color:var(--hot);background:var(--blush-wash)}
.addon input{width:22px;height:22px;accent-color:var(--hot);flex:none}
.addon span{flex:1;min-width:0}.addon em{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums}
.addons{display:grid;gap:8px}
.qty{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.qty button{width:46px;height:46px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;border-radius:50%}
.qty button:hover{background:var(--blush-wash)}
.qty output{min-width:38px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.buy{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* custom builder */
.builder{display:grid;gap:28px;padding-block:28px 72px}
.builder>*{min-width:0}
@media(min-width:960px){.builder{grid-template-columns:1fr 380px;align-items:start}}
.steps{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0;overflow-x:auto;padding-bottom:6px}
.steps li{flex:1;min-width:64px;text-align:center;font-size:.8rem;font-weight:600;color:var(--muted)}
.steps li i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--line);font-style:normal;background:var(--paper);font-variant-numeric:tabular-nums}
.steps li.cur{color:var(--ink)}.steps li.cur i{background:var(--hot);border-color:var(--hot);color:#fff}
.steps li.done i{background:var(--sage);border-color:var(--sage);color:var(--ink)}
.panel{background:var(--paper);border-radius:28px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow);border:1px solid var(--line)}
.panel h2{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:6px}
.panel>p.sub{color:var(--muted);margin-bottom:22px}
.preview{position:sticky;top:90px;background:var(--blush);border:2px solid var(--ink);border-radius:32px;padding:18px 18px 22px;text-align:center}
@media(max-width:959px){.preview{position:static;order:-1;padding:12px}.preview svg{max-height:230px}}
.preview svg{width:100%;height:auto;display:block;margin-inline:auto}
.preview .cap{background:var(--paper);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:.92rem;text-align:left}
.preview .cap b{display:block;font-family:var(--serif);font-size:1.05rem;margin-bottom:2px}
.pick-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px 12px;border-radius:20px;border:2px solid var(--line);background:var(--paper);cursor:pointer;min-width:0}
.pick:hover{border-color:#e2bfc0}
.pick[aria-checked="true"]{border-color:var(--hot);background:var(--blush-wash);box-shadow:0 0 0 1px var(--hot)}
.pick svg{width:64px;height:64px}
.pick b{font-size:.95rem;line-height:1.2}.pick small{color:var(--muted);font-size:.8rem;line-height:1.25}
.swatch{width:46px;height:46px;border-radius:50%;border:2px solid rgba(58,37,48,.35)}
.count{font-size:.88rem;font-weight:600;color:var(--muted);margin:10px 0 0}
.fields{display:grid;gap:16px}
.two{display:grid;gap:16px}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.field label,.field .lbl{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.field .err{color:var(--hot-deep);font-weight:600;font-size:.9rem;margin-top:6px;display:flex;gap:6px}
.field[data-bad] input,.field[data-bad] textarea,.field[data-bad] select{border-color:var(--hot)}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{margin:0;font-weight:600;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:2px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer}
.radios label:has(input:checked){border-color:var(--hot);background:var(--blush-wash)}
.radios input{accent-color:var(--hot);width:18px;height:18px}
.nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.warn{background:var(--butter-wash);border-radius:16px;padding:12px 16px;font-size:.92rem;margin-top:18px;border:1.5px solid #ecd27a}

/* summary */
.sum{display:grid;gap:16px}
.msg{white-space:pre-wrap;word-break:break-word;background:var(--cream);border:2px dashed #e5c3bf;border-radius:18px;padding:16px 18px;font:500 .92rem/1.55 var(--sans);margin:0;max-height:48vh;overflow:auto}
.ok{display:flex;gap:14px;align-items:center;background:var(--sage-wash);border-radius:18px;padding:14px 16px}
.ok svg{width:38px;height:38px;flex:none}

/* about */
.about-grid{display:grid;gap:36px;align-items:center}
@media(min-width:860px){.about-grid{grid-template-columns:1fr 1fr}}
.quote{font-family:var(--serif);font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.25;font-weight:600}
.collage{position:relative;height:420px;max-width:480px;margin-inline:auto;width:100%}
.collage>div{position:absolute;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.collage svg{width:100%;height:100%}
.flow{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));counter-reset:s}
.flow li{list-style:none;counter-increment:s;background:var(--paper);border-radius:24px;padding:22px;border:2px solid var(--ink);position:relative}
.flow li::before{content:counter(s);position:absolute;top:-16px;left:18px;width:36px;height:36px;border-radius:50%;background:var(--butter);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800}
.flow p{color:var(--muted);margin-top:6px}
.flow{padding:16px 0 0;margin:0}
.values{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.values div{padding:22px;border-radius:24px;background:var(--paper)}
.values p{color:var(--muted);margin-top:6px}

/* contact */
.contact-grid{display:grid;gap:28px;padding-block:36px 80px}
@media(min-width:900px){.contact-grid{grid-template-columns:.9fr 1.1fr}}
.info{display:grid;gap:14px;align-content:start}
.info-i{display:flex;gap:14px;background:var(--paper);padding:18px;border-radius:22px;border:1px solid var(--line);align-items:flex-start}
.info-i svg{width:40px;height:40px;flex:none}
.info-i b{display:block;font-family:var(--serif);font-size:1.1rem}
.info-i span,.info-i a{color:var(--muted);overflow-wrap:anywhere}
.info-i a{color:var(--hot-deep);font-weight:600}
.phold{display:inline-block;font-size:.75rem;font-weight:700;background:var(--butter);padding:1px 8px;border-radius:999px;color:var(--ink);margin-left:6px;vertical-align:middle}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:100;background:rgba(58,37,48,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:26px max(20px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px));position:relative;border:2px solid var(--ink)}
@media(min-width:700px){.sheet{border-radius:28px;padding-inline:30px}}
.sheet h2{font-size:1.8rem;padding-right:52px;margin-bottom:6px}
.x{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font-size:1.3rem;line-height:1}
.x:hover{background:var(--blush)}
.pick-line{display:flex;gap:14px;align-items:center;background:var(--blush-wash);border-radius:18px;padding:10px 14px 10px 10px;margin-block:12px 18px}
.pick-line svg{width:64px;height:64px;border-radius:14px;flex:none;background:var(--paper)}
.pick-line b{font-family:var(--serif);font-size:1.15rem;display:block}
.pick-line span{color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:999px;font-weight:600;z-index:200;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
body.lock{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

VIEWS.custom=()=>{C.step=1;return`<section class="page-head"><div class="wrap"><h1 style="font-size:clamp(2.4rem,6vw,4rem)">Design your own bouquet</h1><p class="lead">Six quick steps. Watch your bouquet change as you choose, then send the details to us on WhatsApp.</p></div></section>
<div class="wrap builder"><div><ol class="steps" id="steps" aria-label="Progress"></ol><div class="panel" id="stepPanel"></div></div>
<aside class="preview" aria-label="Bouquet preview"><div id="prev"></div><div class="cap" id="prevCap"></div></aside></div>`};
const C={step:1,size:'M',blooms:[],greens:[],colors:[],wrap:'kraft',message:'',requests:'',name:'',phone:'',date:'',slot:'any',delivery:'delivery',address:''};
const STEPS=['Size','Flowers','Colors','Wrapping','Card','Details','Review'];
function cMix(){const bl=C.blooms.length?C.blooms:['rose','daisy'],cl=(C.colors.length?C.colors:['blush','white']).map(id=>COLORS.find(c=>c.id===id).c);const mix=[];bl.forEach(b=>cl.forEach(c=>mix.push(m(b,c,1))));return mix}
function paintPrev(){const empty=!C.blooms.length;const gr=C.greens.includes('euc')?'euc':C.greens.includes('gyp')?'gyp':'none';
 $('#prev').innerHTML=`<div style="opacity:${empty?.6:1}">${bouquet({mix:cMix(),total:CSIZES[C.size]&&SIZES[C.size].n,wrap:C.wrap,filler:gr,seed:11,label:'Preview of your custom bouquet'})}</div>`;
 const bn=C.blooms.map(id=>BLOOMS.find(b=>b.id===id).n).join(', ')||'Flowers not picked yet';const cn=C.colors.map(id=>COLORS.find(c=>c.id===id).n).join(', ')||'No colors yet';
 $('#prevCap').innerHTML=`<b>${CSIZES[C.size].name} bouquet</b>${esc(bn)}${C.greens.length?' with '+C.greens.map(id=>GREENS.find(g=>g.id===id).n.toLowerCase()).join(' and '):''}<br>${esc(cn)}<br>${WRAPS[C.wrap].n}`}
function paintSteps(){$('#steps').innerHTML=STEPS.map((t,i)=>`<li class="${i+1===C.step?'cur':i+1<C.step?'done':''}"${i+1===C.step?' aria-current="step"':''}><i>${i+1<C.step?'✓':i+1}</i>${t}</li>`).join('')}
const pickCard=(grp,id,inner,checked)=>`<button class="pick" role="${grp==='bloom'||grp==='green'||grp==='color'?'checkbox':'radio'}" data-g="${grp}" data-v="${id}" aria-checked="${checked}">${inner}</button>`;
function stepHTML(n){
 if(n===1)return`<h2>How big should it be?</h2><p class="sub">Pick the size that fits the moment.</p><div class="choices" role="radiogroup" aria-label="Bouquet size">${Object.entries(CSIZES).map(([k,s])=>`<button class="choice" role="radio" data-g="size" data-v="${k}" aria-checked="${C.size===k}"><b>${s.name}</b><small>${s.stems}</small><small>from ${idr(s.from)}</small></button>`).join('')}</div>${priceNote()}`;
 if(n===2)return`<h2>Choose your flowers</h2><p class="sub">Pick up to 3 kinds of blooms. Greenery is optional.</p><div class="pick-grid" role="group" aria-label="Flowers">${BLOOMS.map(b=>pickCard('bloom',b.id,miniFlower(b.id,'#f48fb1')+`<b>${b.n}</b><small>${b.s}</small>`,C.blooms.includes(b.id))).join('')}</div><p class="count" id="cnt-bloom"></p><h3 style="margin:22px 0 10px;font-size:1.15rem">Greenery</h3><div class="pick-grid" role="group" aria-label="Greenery">${GREENS.map(g=>pickCard('green',g.id,`<svg viewBox="-40 -40 80 80" aria-hidden="true">${g.id==='euc'?sprig(0,30,0,-28):'<g fill="#fffdf8" stroke="rgba(58,37,48,.3)"><circle cx="-12" cy="-14" r="6"/><circle cx="6" cy="-20" r="6"/><circle cx="16" cy="-4" r="6"/><circle cx="-4" cy="2" r="6"/><circle cx="-18" cy="8" r="6"/><circle cx="8" cy="14" r="6"/></g>'}</svg><b>${g.n}</b><small>${g.s}</small>`,C.greens.includes(g.id))).join('')}</div>`;
 if(n===3)return`<h2>Pick your colors</h2><p class="sub">Choose up to 3 colors. We will mix them across your flowers. Sunflowers stay yellow.</p><div class="pick-grid" role="group" aria-label="Colors">${COLORS.map(c=>pickCard('color',c.id,`<span class="swatch" style="background:${c.c}"></span><b>${c.n}</b>`,C.colors.includes(c.id))).join('')}</div><p class="count" id="cnt-color"></p>`;
 if(n===4)return`<h2>Choose the wrapping</h2><p class="sub">The finishing touch that makes it look gift-ready.</p><div class="pick-grid" role="radiogroup" aria-label="Wrapping">${Object.entries(WRAPS).map(([k,w])=>pickCard('wrap',k,wrapMini(k)+`<b>${w.n}</b><small>${w.s}</small>`,C.wrap===k)).join('')}</div>`;
 if(n===5)return`<h2>Add your words</h2><p class="sub">Write the message for the greeting card, and tell us anything else we should know.</p><div class="fields"><div class="field"><label for="c-message">Greeting card message</label><textarea id="c-message" data-bind="c.message" maxlength="200" placeholder="e.g. Congrats on finishing your thesis. So proud of you!">${esc(C.message)}</textarea><p class="hint">Up to 200 characters. Leave empty if you do not want a card.</p></div><div class="field"><label for="c-requests">Additional requests</label><textarea id="c-requests" data-bind="c.requests" placeholder="e.g. no baby’s breath, taller bouquet, surprise delivery to the office">${esc(C.requests)}</textarea></div></div>`;
 if(n===6)return`<h2>When and where?</h2><p class="sub">Tell us when you need it and how to reach you.</p><div class="fields">${contactFields('c',C)}</div>`;
 return`<h2>Review and confirm</h2><p class="sub">Check the details, then open WhatsApp to confirm with our admin.</p><div id="cReview"></div>`}
function priceNote(){return`<div class="warn"><b>About pricing.</b> Custom bouquet prices depend on flower availability, size and design complexity. The prices shown are sample starting prices. The admin confirms the final price on WhatsApp.</div>`}
function customMessage(){const s=CSIZES[C.size];return`Hi Bloomé Florist! I'd like to order a custom bouquet 🌸

BOUQUET
• Size: ${s.name} (${s.stems})
• Flowers: ${C.blooms.map(id=>BLOOMS.find(b=>b.id===id).n).join(', ')}
• Greenery: ${C.greens.map(id=>GREENS.find(g=>g.id===id).n).join(', ')||'None'}
• Colors: ${C.colors.map(id=>COLORS.find(c=>c.id===id).n).join(', ')}
• Wrapping: ${WRAPS[C.wrap].n}
• Card message: ${C.message.trim()?'"'+C.message.trim()+'"':'No card'}
• Extra requests: ${C.requests.trim()||'None'}
• Starting price (sample): from ${idr(s.from)}. Final price depends on flower availability, size and design.

${detailsText(C)}

Please confirm availability, final price, payment and delivery. Thank you!`}
function goStep(n){C.step=n;paintSteps();$('#stepPanel').innerHTML=stepHTML(n)+(n<7?`<div class="nav-btns">${n>1?'<button class="btn btn-ghost" data-prev>Back</button>':'<span></span>'}<button class="btn btn-primary" data-next>${n===6?'Review order':'Next'}</button></div>`:'<div id="cBack"></div>');
 if(n===7){$('#cReview').innerHTML=summaryHTML(customMessage(),{back:'c',backLabel:'Edit details'})}
 if(n===2)cnt('bloom');if(n===3)cnt('color');
 const top=$('#steps');if(top&&top.getBoundingClientRect().top<0)top.scrollIntoView({block:'start'})}
function cnt(g){const e=$('#cnt-'+g);if(e)e.textContent=g==='bloom'?`${C.blooms.length} of 3 chosen`:`${C.colors.length} of 3 chosen`}
function stepErr(n){let msg='';if(n===2&&!C.blooms.length)msg='Pick at least one kind of flower to continue.';if(n===3&&!C.colors.length)msg='Pick at least one color to continue.';if(msg){let e=$('#stepErr');if(!e){e=document.createElement('p');e.id='stepErr';e.setAttribute('role','alert');e.style.cssText='color:var(--hot-deep);font-weight:600;margin-top:14px';$('#stepPanel .nav-btns').before(e)}e.textContent=msg;return true}const e=$('#stepErr');if(e)e.remove();return false}
function pick(g,v){
 if(g==='size'||g==='wrap'){C[g]=v}
 else{const k={bloom:'blooms',green:'greens',color:'colors'}[g],arr=C[k],i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else if((g==='bloom'||g==='color')&&arr.length>=3){toast('You can pick up to 3. Remove one to swap.');return}else arr.push(v);cnt(g);const e=$('#stepErr');if(e)e.remove()}
 $$(`[data-g="${g}"]`).forEach(b=>{const k={bloom:'blooms',green:'greens',color:'colors'}[g];b.setAttribute('aria-checked',k?C[k].includes(b.dataset.v):C[g]===b.dataset.v)});paintPrev()}

VIEWS.about=()=>`
<section class="page-head"><div class="wrap about-grid">
 <div><span class="hand">our story</span><h1 style="font-size:clamp(2.4rem,6vw,4rem);margin-top:8px">Every flower carries a story.</h1></div>
 <p class="quote">“At Bloomé Florist, we believe every flower carries a story. Whether it’s a celebration, a thank-you, or a simple reminder that someone matters, we’re here to help you express it through flowers.”</p>
</div></section>
<section class="band"><div class="wrap about-grid">
 <div class="collage">
  <div style="left:0;top:0;width:56%;height:62%;border-radius:999px 999px 20px 20px;background:var(--blush)">${bouquet({mix:prod('forever-yours').mix,total:10,wrap:'blush',filler:'euc',seed:4,vb:'20 20 280 340',label:'Bouquet illustration'})}</div>
  <div style="right:0;top:12%;width:46%;height:46%;border-radius:50%;background:var(--butter)">${bouquet({mix:prod('sunny-side-up').mix,total:7,wrap:'kraft',filler:'euc',seed:8,vb:'50 20 220 260',label:'Bouquet illustration'})}</div>
  <div style="right:6%;bottom:0;width:60%;height:42%;border-radius:24px;background:var(--sage-wash)">${bouquet({mix:prod('mini-moment').mix,total:8,wrap:'kraft',filler:'none',seed:2,vb:'70 20 180 150',label:'Bouquet illustration'})}</div>
  ${sparkle('#f48fb1',34,'left:44%;top:60%')}</div>
 <div><h2>Flowers for people, not just for occasions.</h2>
  <p class="lead" style="margin-block:16px 14px">Bloomé is a modern flower shop for birthdays, graduations, anniversaries and the days that need a little something extra.</p>
  <p class="lead">We keep ordering simple. Pick a ready bouquet or design your own, tell us what you want to say on the card, and we take care of the rest.</p>
  <div class="row" style="margin-top:24px"><a class="btn btn-primary" href="#shop">Shop Bouquets</a><a class="btn btn-ghost" href="#custom">Create Your Own Bouquet</a></div></div>
</div></section>
<section class="band scal" style="background:var(--sage-wash);--band:var(--sage-wash)"><div class="wrap">
 <div class="sec-head"><div><h2>How an order works</h2><p>You always talk to a real person before anything is final.</p></div></div>
 <ol class="flow"><li><h3>Pick or design</h3><p>Browse the shop or build a custom bouquet.</p></li><li><h3>Fill in details</h3><p>Date, delivery or pickup, and your card message.</p></li><li><h3>Confirm on WhatsApp</h3><p>Your summary opens in WhatsApp, ready to send to our admin.</p></li><li><h3>We check and arrange</h3><p>The admin confirms flowers, final price, payment and delivery.</p></li></ol>
</div></section>
<section class="band"><div class="wrap"><div class="values">
 <div style="background:var(--blush-wash)"><h3>Cheerful, not stiff</h3><p>Flowers should feel like a hug, not a formality.</p></div>
 <div style="background:var(--butter-wash)"><h3>Made for your story</h3><p>Every bouquet has a place for your own message.</p></div>
 <div style="background:var(--sage-wash)"><h3>Simple to order</h3><p>A short form and a chat. No accounts, no confusing steps.</p></div></div></div></section>`;

VIEWS.contact=()=>`
<section class="page-head"><div class="wrap"><h1 style="font-size:clamp(2.4rem,6vw,4rem)">Say hello</h1><p class="lead">Questions about an order, an event or a bouquet idea? Message us on WhatsApp or use the form.</p></div></section>
<div class="wrap contact-grid">
 <div class="info">

  <div class="info-i">${iconBubble('#fbd3dc','<rect x="14" y="14" width="26" height="26" rx="8" fill="#fff" stroke="#3a2530" stroke-width="2"/><circle cx="27" cy="27" r="6" fill="none" stroke="#3a2530" stroke-width="2"/><circle cx="34" cy="20" r="1.600" fill="#3a2530"/>')}<div><b>Instagram</b><a href="${IG_URL}" target="_blank" rel="noopener">@${CONFIG.instagram}</a><span class="phold">placeholder</span></div></div>

  <div class="info-i">${iconBubble('#e4edd9','<circle cx="27" cy="27" r="12" fill="#fff" stroke="#3a2530" stroke-width="2"/><path d="M27 20v7l5 3" fill="none" stroke="#3a2530" stroke-width="2" stroke-linecap="round"/>')}<div style="flex:1"><b>Business hours <span class="phold">placeholder</span></b><div class="hours" style="color:var(--muted)">${CONFIG.hours.map(h=>`<span>${h[0]}</span><span>${h[1]}</span>`).join('')}</div></div></div>

  <div id="cfDone" hidden></div></form>
</div>`;

/* =====================  footer  ===================== */
$('#foot').innerHTML=`<div class="wrap"><div class="cols">
 <div><a class="logo" href="#home"><svg viewBox="-20 -20 40 40" aria-hidden="true"><g fill="#f48fb1" stroke="#fff6ea" stroke-width="1.6"><circle cy="-10" r="8"/><circle cy="10" r="8"/><circle cx="-10" r="8"/><circle cx="10" r="8"/></g><circle r="6.5" fill="#fbe38e" stroke="#fff6ea" stroke-width="1.6"/></svg>Bloomé</a><p style="color:#e7efdf;max-width:24em">Flowers That Tell Your Story. Fresh bouquets and custom arrangements for every moment.</p></div>
 <div><h4>Visit and contact</h4><ul><li>${esc(CONFIG.address)}</li><li><a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">WhatsApp ${CONFIG.whatsappShow}</a></li><li><a href="${IG_URL}" target="_blank" rel="noopener">Instagram @${CONFIG.instagram}</a></li></ul></div>
 <div><h4>Opening hours</h4><div class="hours" style="color:#e7efdf">${CONFIG.hours.map(h=>`<span>${h[0]}</span><span>${h[1]}</span>`).join('')}</div></div>
 <div><h4>Explore</h4><ul><li><a href="#shop">Shop</a></li><li><a href="#custom">Custom Bouquet</a></li><li><a href="#about">About Us</a></li><li><a href="#contact">Contact</a></li></ul></div>
</div><p class="small">© Bloomé Florist. Address, hours, phone number and prices are placeholders to edit before launch.</p></div>`;

/* =====================  order modal (product orders)  ===================== */
const OF={name:'',phone:'',date:'',slot:'any',delivery:'delivery',address:'',msg:'',notes:''};
let ORD=null,lastFocus=null;
function openOrder(o){ORD=o;lastFocus=document.activeElement;paintModal('form');$('#modal').hidden=false;document.body.classList.add('lock');setTimeout(()=>$('#sheet').focus(),0)}
function closeModal(){$('#modal').hidden=true;document.body.classList.remove('lock');ORD=null;lastFocus&&lastFocus.focus&&lastFocus.focus()}
function ordTotals(){const p=prod(ORD.id),add=ORD.addons.reduce((s,id)=>s+ADDONS.find(a=>a.id===id).price,0),unit=unitPrice(p,ORD.size);return{p,add,unit,total:(unit+add)*ORD.qty}}
function paintModal(mode){const t=ordTotals(),sh=$('#sheet');
 if(mode==='form'){sh.innerHTML=`<button class="x" data-close aria-label="Close">×</button><h2 id="mTitle">Order ${esc(t.p.name)}</h2><p style="color:var(--muted)">A few details and we will prepare your WhatsApp message.</p>
 <div class="pick-line"><div style="width:64px;height:64px;flex:none;background:${t.p.bg};border-radius:14px;display:flex;align-items:flex-end;overflow:hidden">${artOf(t.p,ORD.size,'60 10 200 200')}</div><div style="min-width:0"><b>${esc(t.p.name)}</b><span id="mSum"></span></div></div>
 <form id="oform" novalidate class="fields">
  <div class="two"><div class="field"><label for="o-size">Size</label><select id="o-size">${Object.entries(SIZES).map(([k,s])=>`<option value="${k}"${ORD.size===k?' selected':''}>${s.name} (${s.stems})</option>`).join('')}</select></div>
  <div class="field"><label for="o-qty">Quantity</label><input type="number" id="o-qty" min="1" max="20" value="${ORD.qty}" inputmode="numeric"></div></div>
  ${contactFields('o',OF)}
  <div class="field"><label for="o-msg">Greeting card message (optional)</label><textarea id="o-msg" data-bind="o.msg" maxlength="200" placeholder="Words for the story tag">${esc(OF.msg)}</textarea></div>
  <div class="field"><label for="o-notes">Notes (optional)</label><textarea id="o-notes" data-bind="o.notes" placeholder="Anything we should know?" style="min-height:70px">${esc(OF.notes)}</textarea></div>
  <button class="btn btn-primary" type="submit">Review order summary</button></form>`;mSum()}
 else sh.innerHTML=`<button class="x" data-close aria-label="Close">×</button><h2 id="mTitle">Almost there</h2><p style="color:var(--muted);margin-bottom:16px">Confirm your order with our admin on WhatsApp.</p>${summaryHTML(orderMessage(),{back:'o',backLabel:'Edit details'})}`;
 sh.scrollTop=0}
function mSum(){const e=$('#mSum');if(!e)return;const t=ordTotals();e.innerHTML=`${SIZES[ORD.size].name}, ${ORD.qty} × ${idr(t.unit+t.add)}${ORD.addons.length?' (with add-ons)':''}<br><b style="color:var(--ink)">Estimated ${idr(t.total)}</b> · sample price`}
function orderMessage(){const t=ordTotals(),ad=ORD.addons.map(id=>ADDONS.find(a=>a.id===id).name).join(', ')||'None';return`Hi Bloomé Florist! I'd like to place an order 🌸

ORDER
• Bouquet: ${t.p.name}
• Size: ${SIZES[ORD.size].name} (${SIZES[ORD.size].stems})
• Quantity: ${ORD.qty}
• Add-ons: ${ad}
• Estimated total: ${idr(t.total)} (sample price, before delivery fee)
• Card message: ${OF.msg.trim()?'"'+OF.msg.trim()+'"':'No card'}
• Notes: ${OF.notes.trim()||'None'}

${detailsText(OF)}

Please confirm availability, final price, payment and delivery. Thank you!`}

/* =====================  events  ===================== */
const bindObj={o:OF,c:C,f:{}};
function onInput(e){const t=e.target,b=t.dataset&&t.dataset.bind;
 if(b){const[s,k]=b.split('.');bindObj[s][k]=t.value;if(k==='delivery'){$$('.addr-wrap').forEach(w=>w.hidden=t.value!=='delivery');$$('.pick-note').forEach(w=>w.hidden=t.value!=='pickup')}return}
 if(t.id==='o-size'&&ORD){ORD.size=t.value;mSum()}
 if(t.id==='o-qty'&&ORD){ORD.qty=Math.min(20,Math.max(1,parseInt(t.value)||1));mSum()}
 if(t.id==='q'&&st.q!==t.value){st.q=t.value;paintShop()}
 if(t.id==='fp'&&st.price!==t.value){st.price=t.value;paintShop()}
 if(t.id==='fs'&&st.sort!==t.value){st.sort=t.value;paintShop()}}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);

document.addEventListener('click',e=>{
 const t=e.target.closest('button,a,[data-order]');if(!t)return;const d=t.dataset;
 if(t.id==='menuBtn'){const o=$('#nav').classList.toggle('open');t.setAttribute('aria-expanded',o);t.setAttribute('aria-label',o?'Close menu':'Open menu');return}
 if(d.order){const p=prod(d.order);openOrder({id:p.id,size:'M',qty:1,addons:[]});return}
 if(d.close!==undefined){closeModal();return}
 if(d.cat){st.filter=d.cat;st.q='';st.price='all'}
 if(d.chip){st.filter=d.chip;$$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===st.filter));paintShop()}
 if(d.clear!==undefined){st.filter='all';st.q='';st.price='all';render()}
 if(d.copy!==undefined){copy($('.msg').textContent)}
 if(d.back==='o'){paintModal('form')}
 if(d.back==='c'){goStep(6)}
 if(d.view!==undefined&&PD){PD.view=+d.view;paintPD()}
 if(d.size&&PD){PD.size=d.size;paintPD()}
 if(d.q&&PD){PD.qty=Math.min(20,Math.max(1,PD.qty+(+d.q)));paintPD()}
 if(t.id==='pdOrder'&&PD)openOrder({id:PD.p.id,size:PD.size,qty:PD.qty,addons:[...PD.addons]});
 if(d.g){pick(d.g,d.v)}
 if(d.next!==undefined){if(stepErr(C.step))return;if(C.step===6){const er=validate(C);if(!showErrors($('#stepPanel'),er))return}goStep(C.step+1)}
 if(d.prev!==undefined)goStep(C.step-1)
 if(t.tagName==='A'&&$('#nav').classList.contains('open')){$('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.addon&&PD){t.checked?PD.addons.add(t.dataset.addon):PD.addons.delete(t.dataset.addon);paintPD()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='oform'){const er=validate(OF);if(showErrors(f,er))paintModal('summary')}
 if(f.id==='cform'){const name=$('#f-name').value.trim(),msg=$('#f-msg').value.trim(),er={};if(!name)er.name='Add your name so we know who is writing.';if(!msg)er.msg='Write a short message so we know how to help.';if(!showErrors(f,er))return;
  const text=`Hi Bloomé Florist! 🌸\n\nTopic: ${$('#f-topic').value}\nName: ${name}${$('#f-phone').value.trim()?'\nWhatsApp: '+$('#f-phone').value.trim():''}\n\n${msg}`;
  $('#cfBody').hidden=true;const d=$('#cfDone');d.hidden=false;d.innerHTML=summaryHTML(text,{back:'f',backLabel:'Edit message'}).replace('Your order summary is ready.','Your message is ready.').replace(/No payment is taken[^<]*/,'');}
});

 if(h.startsWith('product-')){app.innerHTML=VIEWS.product(h.slice(8));paintPD();const p=prod(h.slice(8));document.title=(p?p.name:'Bouquet')+' · Bloomé Florist'}
 else{if(!VIEWS[h])key='home';app.innerHTML=VIEWS[key]();document.title=TITLES[key]}
 $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
 if(key==='shop'&&!h.startsWith('product-')){$('#fp').value=st.price;$('#fs').value=st.sort;paintShop()}
